tracker_monitoring.settings:
  type: config_object
  label: 'Tracker Monitoring settings'
  mapping:
    endpoint:
      type: string
      label: 'Tracker address'
      nullable: true
    send_packages:
      type: boolean
      label: 'Send packages'
    send_status:
      type: boolean
      label: 'Send status report'
    send_logs:
      type: boolean
      label: 'Send log rows'
    log_min_severity:
      type: integer
      label: 'Lowest severity to send'
    log_excluded_types:
      type: sequence
      label: 'Log types to leave out'
      sequence:
        type: string
        label: 'Type'
    log_send_filled_message:
      type: boolean
      label: 'Send the message with its variables filled in'
    set_syslog_format:
      type: boolean
      label: 'Set the syslog format for Tracker'
